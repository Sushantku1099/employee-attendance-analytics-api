name: Verify assignment

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python 3.11 + ${{ matrix.mongo }} regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mongo: ["mongo:6.0", "mongo:7"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Pull MongoDB test image
        run: docker pull ${{ matrix.mongo }}

      - name: Run isolated regression suite
        run: python -B verify_phase3.py --mongo-image ${{ matrix.mongo }}
